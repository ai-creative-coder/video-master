<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme:light; --ink:#18202a; --muted:#667085; --line:#d8dee8; --accent:#275efe; --dark:#111827; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#e9edf3; font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif; }
    header { position:sticky; top:0; z-index:5; padding:18px 5vw; color:white; background:var(--dark); }
    header h1 { margin:0; font-size:22px; } header p { margin:3px 0 0; color:#cbd5e1; }
    main { width:min(1240px,94vw); margin:24px auto 80px; }
    .section-title { margin:36px 0 14px; padding-bottom:8px; border-bottom:3px solid var(--accent); }
    .asset-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    .asset,.segment { background:white; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 8px 28px #17203314; break-inside:avoid; }
    .asset-head,.segment-head,.shot-head { padding:12px 16px; color:white; background:#273244; }
    .asset-head h3,.segment-head h2,.shot-head h3 { margin:0; }
    .asset-frames,.shot-frames { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:9px; padding:12px; background:#0f172a; }
    figure { margin:0; min-width:0; } figure img { display:block; width:100%; height:auto; max-height:480px; object-fit:contain; background:#05070a; border-radius:7px; }
    figcaption { padding:5px 2px 0; color:#cbd5e1; font-size:12px; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .field { padding:11px 15px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); white-space:pre-wrap; }
    .field strong,.prompt strong { display:block; color:var(--muted); font-size:12px; letter-spacing:.05em; text-transform:uppercase; }
    .asset .prompt,.segment .prompt { padding:14px; background:#f8fafc; }
    .prompt pre { margin:7px 0 0; padding:13px; overflow:auto; white-space:pre-wrap; word-break:break-word; background:var(--dark); color:#eef2ff; border-radius:9px; font:13px/1.7 ui-monospace,Consolas,monospace; }
    .segment { margin:0 0 28px; } .segment-meta { padding:12px 16px; background:#f8fafc; }
    .pill { display:inline-block; margin:2px 6px 2px 0; padding:2px 9px; border:1px solid #94a3b8; border-radius:999px; font-size:12px; }
    .shot-block { margin:14px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .shot-head { background:#38465b; }
    @media (max-width:720px) { .details { grid-template-columns:1fr; } }
    @media print { body { background:white; } header { position:static; } main { width:100%; margin:0; } .asset,.segment,.shot-block { box-shadow:none; page-break-inside:avoid; } }
  </style>
</head>
<body>
  <header><h1>{{TITLE}}</h1><p>原视频关键帧资产表、逐镜制作分析与 Seedance 2.5 完整提示词｜无需再次提交参考视频</p></header>
  <main>{{ASSET_LIBRARY}}{{STORY_CARDS}}</main>
</body>
</html>
